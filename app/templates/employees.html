{% extends 'base.html' %}
{% block content %}
    <h1>Employees</h1>
    <a href="{{ url_for('employees.add') }}" class="btn btn-primary mb-3">Add Employee</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Position</th>
                <th>Department</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        {% for emp in employees %}
            <tr>
                <td><a href="{{ url_for('employees.update', employee_id=emp[0]) }}">{{ emp[0] }}</a></td>
                <td>{{ emp[1] }}</td>
                <td>{{ emp[2] }}</td>
                <td>{{ emp[3] or '' }}</td>
                <td>{{ emp[4] or '' }}</td>
                <td>
                    <form action="{{ url_for('employees.delete', employee_id=emp[0]) }}" method="post" style="display:inline-block;">
                        <button type="submit" class="btn btn-link text-danger p-0 border-0" onclick="return confirm('Delete this employee?');" title="Delete">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </form>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
