{% extends 'base.html' %}
{% block content %}
    <h1 class="mb-4">{{ action }} Employee</h1>
    <form method="post">
        <div class="card border-primary shadow-sm" style="width: 28rem;">
            <div class="card-body">
                {% if action == 'Add' %}
                <div class="mb-3">
                    <label for="person" class="form-label">Person</label>
                    <select class="form-select" id="person" name="person" required>
                        <option value="">-- Select a Person --</option>
                        {% for person in persons %}
                            <option value="{{ person[0] }}">{{ person[2] }}, {{ person[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% else %}
                <h6 class="fw-bold text-muted">{{ employee.person_rel.first_name }} {{ employee.person_rel.last_name }} ({{ employee.person_rel.id }})</h6>
                {% endif %}
                <hr>

                <h6 class="fw-bold text-muted">Employee information</h6>
                <div class="mb-3">
                    <label for="start_date" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" required value="{{ employee.start_date if employee else '' }}">
                </div>
                <div class="mb-3">
                    <label for="end_date" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" value="{{ employee.end_date if employee else '' }}">
                </div>
                <div class="mb-3">
                    <label for="position_id" class="form-label">Position</label>
                    <select class="form-select" id="position_id" name="position_id">
                        <option value="">-- None --</option>
                        {% for pos in positions %}
                            <option value="{{ pos[0] }}" {% if employee and employee.position_id == pos[0] %}selected{% endif %}>{{ pos[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="department_id" class="form-label">Department</label>
                    <select class="form-select" id="department_id" name="department_id" required>
                        <option value="">-- Select a Department --</option>
                        {% for dept in departments %}
                            <option value="{{ dept[0] }}" {% if employee and employee.department_id == dept[0] %}selected{% endif %}>{{ dept[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="department_relation" class="form-label">Department Relation</label>
                    <select class="form-select" id="department_relation" name="department_relation">
                        {% for rel in department_relations %}
                            <option value="{{ rel }}" {% if employee and employee.department_relation == rel %}selected{% elif not employee and rel == 'MEMBER' %}selected{% endif %}>{{ rel }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success">{{ action }}</button>
                <a href="{{ url_for('employees.list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </form>
{% endblock %}
