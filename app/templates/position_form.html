{% extends 'base.html' %}
{% block content %}
    <h1>{{ action }} Position</h1>
    <form method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required value="{{ position[0] if position else '' }}">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description">{{ position[1] if position else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">{{ action }}</button>
        <a href="{{ url_for('positions.list') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
