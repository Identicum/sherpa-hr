{% extends 'base.html' %}
{% block content %}
    <h1>Departments</h1>
    <a href="{{ url_for('departments.add') }}" class="btn btn-primary mb-3">Add Department</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Code</th>
                <th>Type</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
        {% for dept in departments %}
            <tr>
                <td>{{ dept.id }}</td>
                <td><a href="{{ url_for('departments.detail', department_id=dept.id) }}">{{ dept.name }}</a></td>
                <td>{{ dept.code }}</td>
                <td>{{ dept.department_type.name }}</td>
                <td>{{ dept.description }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
